name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=youconso
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF
      - run: flutter build apk --release --split-per-abi
      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: IPA non signe
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr youconso-ios-unsigned.ipa Payload
      - uses: softprops/action-gh-release@v2
        with:
          files: youconso-ios-unsigned.ipa
